name: Deploy Atlas to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Sync Congress.gov data, Sync Atlas action histories]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Run checks
        run: npm test
      - name: Build versioned static assets
        run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          name: atlas-pages-${{ github.run_id }}-${{ github.run_attempt }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish Atlas
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: atlas-pages-${{ github.run_id }}-${{ github.run_attempt }}
