name: Sync Congress.gov data
on:
  push:
    branches: [main]
    paths:
      - scripts/sync-congress.mjs
      - scripts/add-companions.mjs
      - data/companion-additions.json
      - scripts/discover-congress.mjs
      - scripts/review-page.mjs
      - data/candidate-decisions.json
      - public/bills.json
      - data/congress-identities.json
      - .github/workflows/congress-sync.yml
  schedule:
    - cron: '23 11 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: congress-data-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fill reviewed companion additions
        run: node scripts/add-companions.mjs
        env:
          CONGRESS_GOV_API_KEY: ${{ secrets.CONGRESS_GOV_API_KEY }}
      - name: Refresh verified legislative facts
        run: npm run sync:congress
        env:
          CONGRESS_GOV_API_KEY: ${{ secrets.CONGRESS_GOV_API_KEY }}
      - name: Discover candidate bills for review
        run: npm run discover:congress
        env:
          CONGRESS_GOV_API_KEY: ${{ secrets.CONGRESS_GOV_API_KEY }}
      - name: Run checks
        run: npm test
      - name: Save public snapshot and review report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/official-changes.json public/bills.json data/companion-audit.json public/congress-data.json data/congress-sync-report.json data/congress-candidates.json data/CANDIDATE-REVIEW.md data/candidate-review.html
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Congress.gov records and candidate review queue'
            git pull --rebase origin main
            git push
          fi
